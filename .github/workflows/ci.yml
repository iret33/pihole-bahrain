name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Unit tests (core, schedule, lists)
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Shell lint
        run: |
          pip install shellcheck-py
          shellcheck install.sh uninstall.sh tests/test_install.sh
      - name: JavaScript syntax
        run: node --check web/app.js
      - name: Installer end-to-end (stubbed system)
        run: sudo -E env "PATH=$PATH" bash tests/test_install.sh
      - name: Browser test (Arabic/English, timers, devices)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python tests/ui_smoke.py --shots screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
