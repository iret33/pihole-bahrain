name: Idea or feature request
description: Suggest something that would help your family
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Sinko to do?
