name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. For a blocked app that still works, please read the
        [troubleshooting guide](https://github.com/iret33/sinko/blob/master/docs/troubleshooting.md) first.
        **Never paste your parent password.** `sudo sinko doctor` output is safe to share.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `sudo sinko doctor`
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Sinko version
      description: Shown in the page under My box, or by `sudo sinko --version`
    validations:
      required: true
  - type: dropdown
    id: board
    attributes:
      label: Hardware
      options: [Orange Pi Zero 3 (ready-made), Orange Pi Zero 3 (own install), Raspberry Pi, Other ARM board, x86 PC or VM, Other]
    validations:
      required: true
  - type: input
    id: router
    attributes:
      label: Router and phone (make, model, system version)
  - type: textarea
    id: logs
    attributes:
      label: Logs, if relevant
      description: "`journalctl -u sinko --since '1 hour ago'` or `/var/log/sinko-install.log`"
      render: text
