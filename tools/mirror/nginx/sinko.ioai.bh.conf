# sinko.ioai.bh — Sinko's website (built from site/ by sinko-dist-sync).
# Hand-maintained; NOT managed by the ioai.bh deploy script. Source: tools/mirror/nginx/ in the Sinko repository.
# Certificate: /etc/letsencrypt/renewal/sinko.ioai.bh.conf (webroot /var/www/letsencrypt, nginx reloaded on renewal).

# ---- HTTP: ACME challenges, everything else -> https ----
server {
    listen 80;
    listen [::]:80;
    server_name sinko.ioai.bh;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://sinko.ioai.bh$request_uri; }
}

# ---- HTTPS: the static site ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sinko.ioai.bh;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/sinko.ioai.bh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sinko.ioai.bh/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # /var/www/sinko-site/live is a symbolic link to the current build; the sync swaps it in one step.
    root /var/www/sinko-site/live;
    disable_symlinks off;
    index index.html;
    autoindex off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
