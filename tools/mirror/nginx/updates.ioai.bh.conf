# updates.ioai.bh — where every Sinko box gets its releases and block lists (filled by sinko-dist-sync).
# Hand-maintained; NOT managed by the ioai.bh deploy script. Source: tools/mirror/nginx/ in the Sinko repository.
# Certificate: /etc/letsencrypt/renewal/updates.ioai.bh.conf (webroot /var/www/letsencrypt, nginx reloaded on renewal).

# ---- HTTP: ACME challenges, everything else -> https ----
server {
    listen 80;
    listen [::]:80;
    server_name updates.ioai.bh;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://updates.ioai.bh$request_uri; }
}

# ---- HTTPS: static files only ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name updates.ioai.bh;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/updates.ioai.bh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/updates.ioai.bh/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/updates.ioai.bh;
    autoindex off;
    # The sync swaps folders by renaming symbolic links (releases/latest/download, lists): follow them.
    disable_symlinks off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # What a box reads to learn the newest release (the same fields as api.github.com/.../releases/latest).
    location = /api/releases/latest {
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    # latest/ changes when a release is published: never cached. A versioned folder never changes.
    location ^~ /releases/latest/ {
        default_type application/octet-stream;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location ^~ /releases/download/ {
        default_type application/octet-stream;
        try_files $uri =404;
    }
    location ^~ /lists/ {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location = / { return 302 https://sinko.ioai.bh/; }
    location / { return 404; }
}
